<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/6b27567aa1.js"
      crossorigin="anonymous"
    ></script>
    <title>Ajout notes</title>
    <script type="module" crossorigin src="/assets/form-B1m8QpV7.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/src-CFHA2lwI.js">
    <link rel="stylesheet" crossorigin href="/assets/src-CFtt7e-r.css">
    <link rel="stylesheet" crossorigin href="/assets/form-C4tZHO0k.css">
  </head>
  <body>
    <main class="container">
      <header class="content-header">
        <div class="logo" id="logo">
          <i class="fa-solid fa-bars"></i>
          <a href="#">DevNotes</a>
        </div>
        <div class="search">
          <i class="fa-solid fa-magnifying-glass fa-1x"></i>
          <input type="text" placeholder="Rechercher une note..." />
        </div>
        <div class="bell-image">
          <i class="fa-regular fa-bell fa-2x" style="color: white"></i>
          <img
            src="/assets/ezechiel-image-Dlk87uil.jpeg"
            alt="image du profile"
          />
        </div>
      </header>
      <aside>
        <div class="aside-content">
          <i
            class="fa-solid fa-house"
            style="color: white; font-size: 2.5rem"
          ></i>
          <a href="#" class="devNotes">Dashboard</a>
        </div>
        <div class="aside-content">
          <i
            class="fa-solid fa-table-list"
            style="color: white; font-size: 2.5rem"
          ></i>
          <a href="./form/form.html" class="ajoutNotes">Nouvelle note</a>
        </div>

        <div class="aside-content">
          <i
            class="fa-solid fa-book-open"
            style="color: white; font-size: 2.5rem"
          ></i>
          <a href="#" class="ajoutNotes">Afficher note</a>
        </div>
      </aside>
      <article class="article">
        <div class="content">
          <form>
            <h2 class="title-underline">Ajouter une note</h2>

            <div class="form-group">
              <label for="category">Titre</label>
              <input id="title" type="text" name="title" />
            </div>

            <div class="form-group">
              <label for="dateNote">Date</label>
              <input id="dateNote" type="date" name="dateNote" />
            </div>

            <div class="form-group">
              <label for="content">Article</label>
              <textarea id="content" name="content"></textarea>
            </div>
            <ul
              id="errors"
              class="text-error"
              aria-live="polite"
              aria-atomic="true"
            ></ul>
            <div class="form-btn-container">
              <button class="btn btn-secondary" type="button">Annuler</button>
              <button class="btn btn-primay" type="submit">Sauvegarder</button>
            </div>
          </form>
        </div>
      </article>
      <footer>Footer</footer>
    </main>
  </body>
</html>
