<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script type="module" crossorigin src="/assets/main-Cz5kddbI.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/styles-vaJypcC2.js">
    <link rel="stylesheet" crossorigin href="/assets/styles-DnaszBbl.css">
    <link rel="stylesheet" crossorigin href="/assets/main-DaG8vFzR.css">
  </head>
  <body class="login">
    <form>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          placeholder="Entrer votre adresse email"
        />
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          name="password"
          placeholder="Entrer votre mot de passe"
        />
      </div>

      <div class="form-btn">
        <button class="btn btn-primary" id="btn-primary" type="button">
          Se connecter
        </button>
      </div>
      <p class="compte">
        Vous n'avez pas encore de compte ?
        <a href="./inscriptions/inscription.html"
          >Inscrivez-vous gratuitement.</a
        >
      </p>
    </form>
  </body>
</html>
