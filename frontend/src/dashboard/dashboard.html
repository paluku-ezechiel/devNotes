<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/6b27567aa1.js"
      crossorigin="anonymous"
    ></script>
    <title>Notes de développement</title>
  </head>
  <body>
    <main class="container">
      <header class="content-header">
        <div class="logo" id="logo">
          <i class="fa-solid fa-bars"></i>
          <a href="./dashboard.html">DevNotes</a>
        </div>
        <div class="search">
          <i class="fa-solid fa-magnifying-glass fa-1x"></i>
          <input type="text" placeholder="Rechercher une note..." />
        </div>
        <div class="bell-image">
          <div class="users-image">
            <span>Ezechiel</span>
            <img
              src="../assets/images/ezechiel-image.jpeg"
              alt="image du profile"
            />
          </div>
          <!-- <i class="fa-regular fa-bell fa-2x" style="color: white"></i>
          <img
            src="./assets/images/ezechiel-image.jpeg"
            alt="image du profile"
          /> -->
        </div>
      </header>
      <aside>
        <div class="aside-content">
          <i
            class="fa-solid fa-house"
            style="color: white; font-size: 2.5rem"
          ></i>
          <a href="./dashboard.html" class="devNotes">Dashboard</a>
        </div>
        <div class="aside-content">
          <i
            class="fa-solid fa-table-list"
            style="color: white; font-size: 2.5rem"
          ></i>
          <a href="/form/form.html" class="ajoutNotes">Nouvelle note</a>
        </div>

        <div class="aside-content">
          <i
            class="fa-solid fa-book-open"
            style="color: white; font-size: 2.5rem"
          ></i>
          <a href="../listes/liste.html" class="ajoutNotes">Afficher note</a>
        </div>
      </aside>
      <article class="article">
        <h1>
          <i class="fa fa-tachometer"></i>
          Tableau de bord
        </h1>
        <div class="dashboard-container">
          <!-- <div class="dashbord-content">
            <div class="dashbord-content-element">
              <p>Nombre de lang</p>
              <div class="dashboard-content-details">
                <span>5</span>
                <i class="fa-solid fa-inbox fa-2x"></i>
              </div>
            </div>
          </div> -->
          <div class="dashbord-content">
            <div class="dashbord-content-element">
              <p>Nombre de fichier</p>
              <div class="dashboard-content-details">
                <span>2</span>
                <i class="fa-solid fa-hourglass-half fa-2x"></i>
              </div>
            </div>
          </div>
          <div class="dashbord-content">
            <div class="dashbord-content-element">
              <p>Nombre des notes</p>
              <div class="dashboard-content-details">
                <span>1</span>
                <i class="fa fa-check-circle fa-2x"></i>
              </div>
            </div>
          </div>
          <div class="dashbord-content">
            <div class="dashbord-content-element">
              <p>Nombre des dossiers</p>
              <div class="dashboard-content-details">
                <span>1</span>
                <i class="fa fa-check-circle fa-2x"></i>
              </div>
            </div>
          </div>
        </div>
      </article>
      <footer>Footer</footer>
    </main>
    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
