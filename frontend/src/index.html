<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
  </head>
  <body class="login">
    <form>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          placeholder="Entrer votre adresse email"
        />
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          name="password"
          placeholder="Entrer votre mot de passe"
        />
      </div>

      <div class="form-btn">
        <button class="btn btn-primary" id="btn-primary" type="button">
          Se connecter
        </button>
      </div>
    </form>
    <script type="module" src="./index.js"></script>
  </body>
</html>
